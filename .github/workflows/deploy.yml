name: Deploy to Cloudflare Workers

on:
  repository_dispatch:
  workflow_dispatch:
  push:
    branches: ['master']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Sin TURBO_TOKEN el Worker quedaría publicado con un token vacío o
      # adivinable: el upstream caía a la palabra 'SECRET'. Acá se aborta.
      - name: Verificar secretos
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in TURBO_TOKEN CF_TOKEN CF_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name en el repo. No se despliega."
              exit 1
            fi
          done

      - run: pnpm install
      - run: pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: 'pnpm'
          secrets: |
            TURBO_TOKEN
          command: deploy
